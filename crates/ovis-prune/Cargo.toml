[package]
name = "ovis-prune"
version = "0.3.0"
edition = "2021"
description = "Deduplication and pruning engine for OVIS"
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
ovis-core = { path = "../ovis-core" }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
regex = "1.10"
whatlang = "0.16"
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, optional = true }

[features]
default = []
cli = ["dep:clap"]
