[package]
name = "ovis-cli"
version.workspace = true
edition = "2021"
description = "Clap CLI and Ratatui TUI for OVIS"
publish = false
license.workspace = true
repository.workspace = true

[[bin]]
name = "ovis"
path = "src/main.rs"

[dependencies]
# The wire types, so a server-side shape change is a compile error here rather
# than a runtime surprise. `ovis-core`'s db/search/onyx modules are the
# *backend's* data plane and are deliberately not used: the CLI speaks HTTP and
# holds no credentials. The one exception is `server setup-onyx-key`, which is
# server-side setup and reuses `onyx::OnyxClient::mint_pat`.
ovis-core = { path = "../ovis-core" }
# Only for `ovis server start`, which embeds the backend in this binary.
ovis-backend = { path = "../ovis-backend" }

tokio = { workspace = true }
clap = { workspace = true, features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
reqwest = { workspace = true, features = ["json", "gzip", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"
toml = "0.8"
chrono = { workspace = true }
anyhow = { workspace = true }
comfy-table = "7.1"
csv = "1.3"
anstream = "0.6"
anstyle = "1.0"
indicatif = "0.18"
humantime = "2"
ratatui = "0.29"
crossterm = { version = "0.29", features = ["event-stream"] }
open = "5"
directories = "6"
percent-encoding = { workspace = true }
unicode-width = "0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
wiremock = "0.6"
tempfile = "3"
