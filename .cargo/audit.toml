# cargo-audit configuration.
#
# `cargo audit` reads Cargo.lock, which lists every *resolvable* dependency
# including optional ones behind features that are never enabled. The ignores
# below are for exactly that case, and each one records why. Nothing here is a
# blanket suppression: re-check them whenever a dependency moves.
#
#     cargo audit

[advisories]
ignore = [
    # RSUSTSEC-2023-0071 — Marvin attack on `rsa` 0.9.
    #
    # `rsa` is pulled in by `sqlx-mysql`, which is an *optional* dependency of
    # `sqlx` behind the `mysql` feature. OVIS enables only `postgres`, so
    # sqlx-mysql is never compiled and `rsa` is never linked. Confirm with:
    #
    #     cargo tree --workspace -i rsa -e normal     # -> "nothing to print"
    #
    # There is no fixed release of `rsa`; the finding disappears when sqlx stops
    # depending on it, not when we upgrade.
    "RUSTSEC-2023-0071",
]

# Unmaintained/unsound advisories are reported but do not fail the run. Two are
# currently outstanding, both from `ratatui 0.29` in `ovis-cli` and neither
# reachable from the backend:
#
#   `paste` (RUSTSEC-2024-0436, unmaintained) — a proc-macro, so it runs at
#     compile time and ships no code. The CLI redesign's 0.26 -> 0.29 upgrade was
#     expected to drop it; 0.29 still depends on it.
#   `lru` (RUSTSEC-2026-0002, unsound `IterMut`) — `cargo audit` flags the
#     lockfile entry, but `cargo deny`, which resolves features, does not see an
#     affected version in the graph. OVIS never calls `IterMut`; the TUI's own
#     cache is `tui::data::Lru`, written by hand precisely so this is not load
#     bearing.
informational_warnings = ["unmaintained", "unsound"]
